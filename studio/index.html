<style>

:root{color-scheme:dark;--bg:#14161b;--panel:#1e2128;--panel2:#292d37;--line:#383d4a;--text:#f2f4f8;--dim:#a9b0c0;--accent:#2fd5c5;--accent2:#4f7dff;--accent-ink:#04201d;--danger:#ff7676;--font:"Pretendard","IBM Plex Sans KR","Noto Sans KR",system-ui,sans-serif}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:13px/1.45 var(--font);overflow:hidden;user-select:none}
button,select,input,textarea{font:inherit;color:inherit}
button{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:4px 10px;cursor:pointer;white-space:nowrap}

button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}

:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
select,input[type=number],input[type=text],textarea{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:3px 7px;user-select:text;min-width:0}
input[type=range]{accent-color:var(--accent);min-width:0;flex:1}
input[type=color]{width:30px;height:24px;padding:0;border:1px solid var(--line);border-radius:5px;background:none;flex:0 0 30px;cursor:pointer}
.hint{font-size:12px;color:var(--dim);margin:0 0 8px}
#home{position:fixed;inset:0;overflow:auto;background:var(--bg);z-index:5}
#home .wrap{max-width:1180px;margin:0 auto;padding:26px 24px 60px}
#home h1{margin:0 0 4px;font-size:26px;font-weight:900;letter-spacing:-.02em}
#home h1 b{color:var(--accent)}
#home .sub{color:var(--dim);margin:0 0 18px}
.newbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:18px}
.newbar input{width:84px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:3px 11px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);font-size:12.5px}
.tabs{display:flex;gap:6px;margin:16px 0 12px;flex-wrap:wrap}
.tabs button{border-radius:999px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;cursor:pointer;position:relative}
.card:hover{border-color:var(--accent);transform:translateY(-1px)}
.card canvas,.card img{display:block;width:100%;background:#0c0d10}
.card .nm{padding:7px 10px;font-size:12.5px;display:flex;justify-content:space-between;gap:6px}
.card .nm span{color:var(--dim)}
.card .del{position:absolute;top:6px;right:6px;display:none}
.card:hover .del{display:block}
.badge{position:absolute;left:6px;top:6px;background:#000a;border-radius:5px;padding:0 6px;font-size:11px}
#ed{position:fixed;inset:0;display:grid;grid-template-rows:46px 1fr;background:var(--bg)}
#ed[hidden],#home[hidden]{display:none}
#top{display:flex;align-items:center;gap:6px;padding:0 10px;background:var(--panel);border-bottom:1px solid var(--line)}
#top .sp{flex:1}
#top input[type=text]{width:180px}
.seg{display:inline-flex}
.seg button{border-radius:0;margin-left:-1px}

.seg button:last-child{border-radius:0 6px 6px 0}

#rail button b{font-size:19px;font-weight:400;line-height:1.1;color:var(--text)}
#rail button.on{background:#1b3a3a;color:var(--accent)}
#lp{background:var(--panel);border-right:1px solid var(--line);overflow:auto;padding:12px;min-width:0}

#smallPrev canvas{background:#222;border-radius:4px;display:block}
#smallPrev small{display:block;color:var(--dim);font-size:10px;text-align:center}
#rp{background:var(--panel);border-left:1px solid var(--line);overflow:auto;min-width:0}

#rp .tabs2 button.on{color:var(--accent);border-bottom-color:var(--accent)}
#rp .body{padding:12px}
.sec{border-bottom:1px solid var(--line);padding:0 0 10px;margin:0 0 10px}
.sec:last-child{border-bottom:0}
.row{display:flex;align-items:center;gap:6px;margin:5px 0;min-height:26px}
.row>label{flex:0 0 66px;color:var(--dim);font-size:12px}
.row input[type=number]{width:62px}
.row select{flex:1;min-width:0}
.row .v{width:38px;text-align:right;color:var(--dim);font-size:11.5px;font-variant-numeric:tabular-nums}
.row.two{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.row.two>div{display:flex;align-items:center;gap:5px}
.row.two label{color:var(--dim);font-size:12px;flex:0 0 auto}
.row.two input{flex:1;width:100%}
.swatches{display:flex;gap:4px;flex-wrap:wrap;margin:4px 0 6px}
.sw{width:20px;height:20px;border-radius:5px;border:1px solid #fff3;cursor:pointer}
.tbtn{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.tbtn button{padding:14px 4px;font-size:15px;font-weight:700}
.stylegrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:8px}
.stylegrid canvas{width:100%;display:block;border-radius:8px;cursor:pointer;border:1px solid var(--line);background:#2a2d36}
.stylegrid canvas:hover{border-color:var(--accent)}
.shapes{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.shapes canvas{width:100%;aspect-ratio:1;background:var(--panel2);border:1px solid var(--line);border-radius:7px;cursor:pointer}
.shapes canvas:hover{border-color:var(--accent)}
.emo{display:grid;grid-template-columns:repeat(6,1fr);gap:2px}
.emo button{font-size:21px;padding:2px;background:none;border-color:transparent}
.emo button:hover{background:var(--panel2)}
.drop{border:2px dashed var(--line);border-radius:10px;padding:22px 10px;text-align:center;color:var(--dim);cursor:pointer}
.drop:hover,.drop.over{border-color:var(--accent);color:var(--accent)}
.layers{display:flex;flex-direction:column;gap:3px}
.lay{display:flex;align-items:center;gap:6px;background:var(--panel2);border:1px solid transparent;border-radius:7px;padding:3px 6px;cursor:pointer}
.lay.sel{border-color:var(--accent);background:#1b3a3a}
.lay canvas{width:34px;height:34px;border-radius:4px;background:repeating-conic-gradient(#3a3d46 0 25%,#2a2d35 0 50%) 0 0/10px 10px;flex:0 0 34px}
.lay .n{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12.5px}
.lay button{padding:0 5px;border:0;background:none;color:var(--dim);font-size:14px}
.lay button.off{opacity:.35}
.lay.dragover{border-color:var(--accent2)}
#tl{background:var(--panel);border-top:1px solid var(--line);height:200px;display:grid;grid-template-columns:200px 1fr;min-height:0}
#tl[hidden]{display:none}
#tlHead{border-right:1px solid var(--line);overflow:auto;padding-top:28px}

#tlHead div.sel{background:#1b3a3a;color:var(--accent)}
#tlBody{position:relative;overflow:auto}
#tlRuler{position:sticky;top:0;height:28px;background:var(--panel2);border-bottom:1px solid var(--line);z-index:3}
.tick{position:absolute;top:0;height:100%;border-left:1px solid #fff2;font-size:10px;color:var(--dim);padding-left:3px;pointer-events:none}

.bar.sel{background:#2f9d95;border-color:var(--accent)}

.modal h2{margin:0 0 12px;font-size:17px}
.modal .acts{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
progress{width:100%;accent-color:var(--accent)}
#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#000d;border:1px solid var(--line);padding:8px 16px;border-radius:9px;z-index:99;display:none}
#tbox{position:absolute;z-index:6;background:transparent;border:1px dashed var(--accent);outline:none;resize:none;overflow:hidden;white-space:pre;padding:0;margin:0;line-height:1.2;transform-origin:center center}
.gr{display:flex;gap:4px;align-items:center;margin:3px 0}
.gr input[type=range]{flex:1}
.gr button{padding:0 6px}
.gradbar{height:16px;border-radius:5px;border:1px solid var(--line);margin:4px 0}

 <div class="wrap">

  <div class="newbar">

   <input type="number" id="nh" value="720" min="16" max="8000" aria-label="세로">
   <button class="primary" id="nCreate">만들기</button>
   <div class="chips" id="sizeChips"></div>
   <span style="flex:1"></span>
   <button id="nOpen" title="이미지·프로젝트 파일 열기">📂 파일 열기</button>
   <input type="file" id="openFile" accept="image/*,.csd,application/json" hidden>
  </div>
  <div id="mineWrap" hidden>
   <h2 style="margin:0 0 10px;font-size:16px">내 디자인</h2>
   <div class="grid" id="mine"></div>
  </div>
  <div class="tabs" id="tplTabs"></div>
  <div class="grid" id="tplGrid"></div>
 </div>
</section>
<section id="ed" hidden>
 <header id="top">
  <button id="bHome">← 홈</button>
  <input type="text" id="dname" aria-label="디자인 이름">
  <span id="saveState" style="color:var(--dim);font-size:12px"></span>
  <button id="undo" title="Ctrl+Z">↶</button><button id="redo" title="Ctrl+Shift+Z">↷</button>
  <span class="sp"></span>
  <div class="seg"><button id="mDesign" class="on">🎨 디자인</button><button id="mAnim">🎬 애니메이션</button></div>
  <span class="sp"></span>
  <button id="bResize">📐 크기 변경</button>
  <button id="bGuides" title="유튜브 시간 표시·안전 영역">▦ 안전 영역</button>
  <button id="bSmall" class="on" title="작게 보기">🔍 작게 보기</button>
  <button id="bSend" hidden>🎞 컷룸으로 보내기</button>
  <button id="bExport" class="primary">⬇ 내보내기</button>
 </header>
 <div id="main">
  <nav id="rail"></nav>
  <aside id="lp"></aside>
  <div id="center">
   <div id="stageWrap">
    <canvas id="stage"></canvas>
    <div id="smallPrev"></div>
    <div id="zoomBar"><button class="mini" id="zOut">−</button><span id="zVal">100%</span><button class="mini" id="zIn">＋</button><button class="mini" id="zFit">맞춤</button></div>
   </div>
   <div id="playBar" hidden>
    <button id="pPlay" class="primary">▶ 재생</button><button id="pStop">■</button>
    <span class="t" id="pTime">0.00 / 4.00</span>
    <label style="color:var(--dim)">길이 <input type="number" id="pDur" min="0.5" max="60" step="0.5" style="width:64px"> 초</label>
    <label style="color:var(--dim)"><input type="checkbox" id="pLoop" checked> 반복</label>
    <span style="flex:1"></span>
    <button id="pAuto" title="레이어를 차례로 등장시킵니다">✨ 자동 순서</button>
   </div>
   <div id="tl" hidden><div id="tlHead"></div><div id="tlBody"><div id="tlRuler"></div><div id="tlRows"></div><div class="ph" id="tlPh"></div></div></div>
  </div>
  <aside id="rp"></aside>
 </div>
</section>
<div id="toast"></div>
<input type="file" id="imgIn" accept="image/*" multiple hidden>

/* ----- 이미지 불러오기 ----- */
const MAXPX=4096;
function loadImageBlob(blob){return new Promise((res,rej)=>{
  const url=URL.createObjectURL(blob),im=new Image();
  im.onload=()=>{
    let el=im,w=im.naturalWidth,hh=im.naturalHeight,b=blob;
    const finish=()=>{const id='I'+(UID++);imgs.set(id,{el,w,h:hh,blob:b,url});res(id);};
    if(Math.max(w,hh)>MAXPX){const s=MAXPX/Math.max(w,hh),c=document.createElement('canvas');c.width=Math.round(w*s);c.height=Math.round(hh*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);
      el=c;w=c.width;hh=c.height;c.toBlob(bb=>{b=bb;finish();},'image/png');}
    else finish();
  };
  im.onerror=()=>rej(new Error('이미지를 열 수 없습니다'));im.src=url;});}
function dataURLtoBlob(u){const [a,b]=u.split(',');const m=/:(.*?);/.exec(a)[1];const bin=atob(b);const arr=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i);return new Blob([arr],{type:m});}
const blobToDataURL=b=>new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result);f.readAsDataURL(b);});

/* ----- 기록 (되돌리기) ----- */
let hist=[],hi=-1,saveTimer=null,curId=null,dirty=false;
const snap=()=>JSON.stringify(doc,(k,v)=>k[0]==='_'?undefined:v);
function resetHist(){hist=[snap()];hi=0;updUndo();}
function commit(){const s=snap();if(hist[hi]===s)return;hist=hist.slice(0,hi+1);hist.push(s);if(hist.length>120)hist.shift();hi=hist.length-1;updUndo();dirty=true;scheduleSave();}
function undo(){if(hi<=0)return;hi--;restore();}
function redo(){if(hi>=hist.length-1)return;hi++;restore();}
function restore(){doc=JSON.parse(hist[hi]);sel=sel.filter(id=>doc.layers.some(l=>l.id===id));doc.layers.forEach(l=>{if(l.type==='text')fitText(l)});afterDocChange();updUndo();scheduleSave();}
function updUndo(){const u=$('#undo'),r=$('#redo');if(u){u.disabled=hi<=0;r.disabled=hi>=hist.length-1;}}

/* ----- 저장 (이 컴퓨터/브라우저 IndexedDB) ----- */
function idb(){return new Promise((res,rej)=>{const q=indexedDB.open('cutroom-studio',1);q.onupgradeneeded=()=>q.result.createObjectStore('designs',{keyPath:'id'});q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error);});}
async function idbDo(mode,fn){const d=await idb();return new Promise((res,rej)=>{const tx=d.transaction('designs',mode),st=tx.objectStore('designs'),r=fn(st);tx.oncomplete=()=>res(r&&r.result);tx.onerror=()=>rej(tx.error);});}
async function pack(){

  return{doc:JSON.parse(snap()),imgs:used};}

  doc=d.doc;
  for(const k of Object.keys(imgs)){}
  const m=Math.max(0,...[...imgs.keys()].map(k=>parseInt(k.slice(1))||0));UID=Math.max(UID,m+1);
}
function scheduleSave(){clearTimeout(saveTimer);$('#saveState').textContent='변경됨';saveTimer=setTimeout(saveNow,1500);}
async function saveNow(){
  if(!doc)return;
  try{
    if(!curId)curId='D'+Date.now().toString(36);
    const p=await pack();const th=makeThumb(doc,360);
    await idbDo('readwrite',st=>st.put({id:curId,name:doc.name,w:doc.w,h:doc.h,updated:Date.now(),thumb:th,data:p}));
    dirty=false;$('#saveState').textContent='저장됨';
  }catch(e){$('#saveState').textContent='저장 실패';}
}
async function listDesigns(){try{const d=await idb();return await new Promise(r=>{const o=d.transaction('designs').objectStore('designs').getAll();o.onsuccess=()=>r(o.result.sort((a,b)=>b.updated-a.updated));o.onerror=()=>r([]);});}catch(e){return[];}}

function shapePath(c,s,W,H,L){

    case 'tri':poly([[0,y],[W/2,y+H],[-W/2,y+H]]);break;

    case 'hex':{const pts=[];for(let i=0;i<6;i++){const a=i*Math.PI/3;pts.push([Math.cos(a)*W/2,Math.sin(a)*H/2]);}poly(pts);break;}

    case 'arrow':poly([[x,-H*.2],[W*.1,-H*.2],[W*.1,y],[W/2,0],[W*.1,H/2],[W*.1,H*.2],[x,H*.2]]);break;
    case 'chevron':poly([[x,y],[W*.15,y],[W/2,0],[W*.15,H/2],[x,H/2],[-W*.15,0]]);break;
    case 'cross':{const a=W*.17,b=H*.17;poly([[-a,y],[a,y],[a,-b],[W/2,-b],[W/2,b],[a,b],[a,H/2],[-a,H/2],[-a,b],[x,b],[x,-b],[-a,-b]]);break;}

    case 'ring':c.ellipse(0,0,W/2,H/2,0,0,Math.PI*2);c.moveTo(W*.3,0);c.ellipse(0,0,W*.3,H*.3,0,0,Math.PI*2,true);break;
    default:c.rect(x,y,W,H);
  }
}
function paintOf(c,f,w,hh){
  if(!f||f.k==='solid')return f?f.c:'#fff';
  const a=(f.a||0)*DEG,co=Math.cos(a),si=Math.sin(a);let g;
  if(f.t==='rad')g=c.createRadialGradient(0,0,0,0,0,Math.max(w,hh)/2);
  else{const hl=(Math.abs(co)*w+Math.abs(si)*hh)/2;g=c.createLinearGradient(-co*hl,-si*hl,co*hl,si*hl);}

const rgba=(hex,a)=>{const n=parseInt(hex.slice(1),16);return `rgba(${n>>16&255},${n>>8&255},${n&255},${a})`;};

/* ----- 글자 ----- */
const mctx=document.createElement('canvas').getContext('2d');
function fontStr(L){return `${L.it?'italic ':''}${L.wt} ${L.size}px "${L.font}",${L.emoji?'"Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",':''}"Pretendard","Noto Sans KR",sans-serif`;}
const fontSeen=new Set();
function needFont(L){
  const key=L.font+'|'+L.wt+'|'+L.it+'|'+L.text;if(fontSeen.has(key))return;fontSeen.add(key);
  if(!document.fonts||!document.fonts.load)return;
  const chars=[...new Set(String(L.text))].join('')+'가나다ABC';
  document.fonts.load(`${L.it?'italic ':''}${L.wt} 40px "${L.font}"`,chars).then(()=>{L._lk=null;if(doc&&doc.layers.includes(L))fitText(L);requestDraw();if(window.onFontLoaded)window.onFontLoaded();}).catch(()=>{});
}
function parseLine(line){const out=[];let hl=false,buf='';for(const ch of line){if(ch==='*'){if(buf)out.push({s:buf,hl});buf='';hl=!hl;}else buf+=ch;}if(buf)out.push({s:buf,hl});return out;}
function wrapRaw(raw,bw){
  const out=[],plain=s=>mctx.measureText(s.replace(/\*/g,'')).width;let carry=false;
  const emit=s=>{const cnt=(s.match(/\*/g)||[]).length,end=carry!==(cnt%2===1);out.push((carry?'*':'')+s+(end?'*':''));carry=end;};
  for(const line of raw.split('\n')){
    if(!(bw>0)){emit(line);continue;}
    let cur='';
    for(const wd of line.split(' ')){const t=cur?cur+' '+wd:wd;if(cur&&plain(t)>bw){emit(cur);cur=wd;}else cur=t;}
    emit(cur);
  }
  return out;
}
function layoutText(L){
  const key=[L.text,L.font,L.wt,L.it,L.size,L.ls,L.lh,L.bw,L.emoji?1:0].join('|');
  if(L._lk===key&&L._lines)return L._lines;
  mctx.font=fontStr(L);mctx.letterSpacing=(L.ls||0)+'px';
  const lines=wrapRaw(String(L.text),L.bw).map(raw=>{const segs=parseLine(raw);let w=0;for(const g of segs){g.w=mctx.measureText(g.s).width;w+=g.w;}return{segs,w};});
  L._lines=lines;L._lk=key;return lines;

function fitText(L){
  needFont(L);const lines=layoutText(L);

  L.w=Math.max(8,mw);L.h=Math.max(8,lines.length*L.size*L.lh);

function drawText(c,L,S,o){
  needFont(L);const lines=layoutText(L),lh=L.size*L.lh,W=L.w,H=L.h;

  const k=o.k||1,sh=L.sh;
  let total=0;for(const l of lines)for(const g of l.segs)total+=[...g.s].length;
  let left=S.chars<1?Math.ceil(total*S.chars):Infinity;
  if(L.box.on){c.save();c.fillStyle=L.box.c;const p=L.size*L.box.pad;c.beginPath();c.roundRect(-W/2-p,-H/2-p*.6,W+p*2,H+p*1.2,L.size*L.box.r);if(sh.on)shadowOn(c,L,o,S);c.fill();c.restore();}
  let first=!L.box.on;
  const pass=(kind)=>{
    let rem=left;
    if(kind!=='fill'){c.lineWidth=2*(kind==='st2'?L.st1.w+L.st2.w:L.st1.w);c.strokeStyle=kind==='st2'?L.st2.c:L.st1.c;}
    for(let i=0;i<lines.length;i++){

      for(const g of l.segs){

/* ----- 이미지 ----- */
function filterStr(L){
  const f=L.f;let s='';
  if(f.br!==100)s+=`brightness(${f.br}%) `;if(f.co!==100)s+=`contrast(${f.co}%) `;if(f.sa!==100)s+=`saturate(${f.sa}%) `;

  return s.trim();
}
function getCut(L,I){

  if(I.cut&&I.cut.key===key)return I.cut.cv;
  const s=Math.min(1,2048/Math.max(I.w,I.h)),W=Math.max(1,Math.round(I.w*s)),H=Math.max(1,Math.round(I.h*s));
  const cv=document.createElement('canvas');cv.width=W;cv.height=H;const c=cv.getContext('2d',{willReadFrequently:true});c.drawImage(I.el,0,0,W,H);
  const id=c.getImageData(0,0,W,H),d=id.data,N=W*H;
  const tol=cu.tol*1.8,dist=(i,r,g,b)=>Math.hypot(d[i]-r,d[i+1]-g,d[i+2]-b);

  }else{
    const cs=[0,W-1,(H-1)*W,H*W-1].map(p=>p*4);let r=0,g=0,b=0;cs.forEach(i=>{r+=d[i];g+=d[i+1];b+=d[i+2];});r/=4;g/=4;b/=4;

    for(let x=0;x<W;x++){push(x);push((H-1)*W+x);}for(let y=0;y<H;y++){push(y*W);push(y*W+W-1);}
    while(sp){const p=st[--sp],x=p%W,y=(p/W)|0;if(x>0)push(p-1);if(x<W-1)push(p+1);if(y>0)push(p-W);if(y<H-1)push(p+W);}

const srcOf=(L,I)=>L.cut.on?getCut(L,I):I.el;

let playStart=0,playRange=0,playOnce=false,playFrom=0;
function play(from,to,once){
  ptime=from;playFrom=from;playRange=to==null?doc.dur:to;playOnce=!!once;playStart=performance.now()-from*1000;playing=true;syncPlayUI();tick();
}
function stopPlay(reset){playing=false;if(reset)ptime=0;syncPlayUI();draw();movePlayhead();}
function tick(){
  if(!playing)return;
  let t=(performance.now()-playStart)/1000;
  if(t>=playRange){
    if(doc.loop&&!playOnce){playStart=performance.now()-playFrom*1000*(playOnce?1:0);t=playOnce?playFrom:0;playStart=performance.now();}
    else{ptime=playRange;playing=false;syncPlayUI();draw();movePlayhead();return;}
  }
  ptime=t;draw();movePlayhead();requestAnimationFrame(tick);
}

  if($('#pDur')&&document.activeElement!==$('#pDur'))$('#pDur').value=doc.dur;
  if($('#pLoop'))$('#pLoop').checked=!!doc.loop;

const safeName=()=>(doc.name||'design').replace(/[\\/:*?"<>|]/g,'_');
function frameCanvas(scale,t,fill){
  const cv=document.createElement('canvas');cv.width=Math.max(1,Math.round(doc.w*scale));cv.height=Math.max(1,Math.round(doc.h*scale));
  const c=cv.getContext('2d',{willReadFrequently:!!fill===false?false:false});
  if(fill){c.fillStyle=fill;c.fillRect(0,0,cv.width,cv.height);}
  c.setTransform(scale,0,0,scale,0,0);renderDoc(c,t,{editor:false,k:scale});return cv;
}
async function imageBlob(fmt,scale,q,fit2mb){
  const t=mode==='anim'?ptime:null,mime={png:'image/png',jpg:'image/jpeg',webp:'image/webp'}[fmt];
  const fill=(fmt!=='png'&&doc.bg.k==='none')?'#ffffff':null;
  let s=scale,qq=q,blob;
  for(let i=0;i<14;i++){
    const cv=frameCanvas(s,t,fill);blob=await new Promise(r=>cv.toBlob(r,mime,qq));
    if(!fit2mb||blob.size<=2*1024*1024||fmt==='png')break;

  }

}
async function gifBlob(o,prog){
  const s=Math.min(1,o.maxW/doc.w),W=Math.max(2,Math.round(doc.w*s)),H=Math.max(2,Math.round(doc.h*s)),n=Math.max(1,Math.round(doc.dur*o.fps));
  const gif=GE.GIFEncoder(),transp=doc.bg.k==='none';
  const cv=document.createElement('canvas');cv.width=W;cv.height=H;const c=cv.getContext('2d',{willReadFrequently:true});
  for(let i=0;i<n;i++){
    const t=Math.min(doc.dur,i/o.fps);c.setTransform(1,0,0,1,0,0);c.clearRect(0,0,W,H);
    if(!transp){c.fillStyle='#ffffff';c.fillRect(0,0,W,H);}
    c.setTransform(s,0,0,s,0,0);renderDoc(c,t,{editor:false,k:s});c.setTransform(1,0,0,1,0,0);
    const d=c.getImageData(0,0,W,H).data;
    const fmt=transp?'rgba4444':'rgb565',pal=GE.quantize(d,256,transp?{format:fmt,oneBitAlpha:true,clearAlpha:true,clearAlphaThreshold:100}:{format:fmt});
    const idx=GE.applyPalette(d,pal,fmt);

    if(transp){const ti=pal.findIndex(p=>p[3]===0);if(ti>=0){opts.transparent=true;opts.transparentIndex=ti;}opts.dispose=2;}
    gif.writeFrame(idx,W,H,opts);
    prog(i+1,n);if(i%2===1)await new Promise(r=>setTimeout(r));
  }
  gif.finish();return new Blob([gif.bytes()],{type:'image/gif'});
}
function pickVideoMime(prefer){
  const mp4=['video/mp4;codecs=avc1.640028','video/mp4;codecs=avc1.42E01E','video/mp4'],webm=['video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm'];
  const list=prefer==='mp4'?[...mp4,...webm]:[...webm,...mp4];
  return list.find(m=>window.MediaRecorder&&MediaRecorder.isTypeSupported(m))||'';
}
async function videoBlob(o,prog){
  const s=o.scale,W=Math.round(doc.w*s/2)*2,H=Math.round(doc.h*s/2)*2;
  const cv=document.createElement('canvas');cv.width=W;cv.height=H;const c=cv.getContext('2d');
  const mime=pickVideoMime(o.fmt);if(!mime)throw new Error('이 브라우저는 영상 내보내기를 지원하지 않습니다. GIF를 사용해 주세요.');
  const stream=cv.captureStream(o.fps);
  const rec=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:clamp(W*H*o.fps*.2,2e6,30e6)});
  const chunks=[];rec.ondataavailable=e=>{if(e.data.size)chunks.push(e.data);};
  const done=new Promise(r=>rec.onstop=r);
  const total=doc.dur*o.loops;
  const paint=t=>{c.setTransform(1,0,0,1,0,0);c.fillStyle=doc.bg.k==='none'?'#000000':'#ffffff';c.fillRect(0,0,W,H);c.setTransform(W/doc.w,0,0,H/doc.h,0,0);renderDoc(c,t%doc.dur,{editor:false,k:W/doc.w});};
  paint(0);rec.start(200);
  await new Promise(r=>setTimeout(r,120));
  const st=performance.now();
  await new Promise(res=>{const f=()=>{const t=(performance.now()-st)/1000;if(t>=total){paint(doc.dur-.001);res();return;}paint(t);prog(t,total);requestAnimationFrame(f);};f();});
  await new Promise(r=>setTimeout(r,160));rec.stop();await done;
  return {blob:new Blob(chunks,{type:mime.split(';')[0]}),ext:mime.startsWith('video/mp4')?'mp4':'webm'};
}

function mkEmojiAdd(d,e,o){const L=mkEmoji(e,o);d.layers.push(L);return L;}
function buildTemplate(t){const d=newDoc(t.w,t.h,t.n);withDoc(d,()=>t.mk(d));return d;}
'use strict';
/* ================= 첫 화면 · 열기 · 컷룸 연결 ================= */
let homeCat='all';
function openDoc(d,keepImgs){
  if(!keepImgs)imgs.clear();
  doc=d;doc.layers.forEach(l=>{if(l.type==='text')fitText(l);});sel=[];mode='design';ptime=0;playing=false;
  $('#mDesign').classList.add('on');$('#mAnim').classList.remove('on');$('#tl').hidden=true;$('#playBar').hidden=true;
  $('#home').hidden=true;$('#ed').hidden=false;$('#dname').value=doc.name;
  resetHist();rightTab='props';leftTab=doc.layers.length?'text':'templates';tool='select';
  renderRail();renderLeft();renderProps();
  ensureSmall();$('#smallPrev').hidden=!showSmall;
  setTimeout(()=>{sizeStage();fitView();},20);
  $('#saveState').textContent=curId?'저장됨':'';
}
function newBlank(w,hh,name){curId=null;openDoc(newDoc(w,hh,name||'새 디자인'));}
function useTemplate(t){
  if(doc&&!$('#ed').hidden){saveNow();}
  curId=null;const keep=!!doc&&!$('#ed').hidden;const d=buildTemplate(t);openDoc(d,keep);
  toast(t.c==='anim'?'애니메이션 템플릿입니다. 위쪽 "🎬 애니메이션"에서 재생해 보세요.':'사진 자리에 사진을 끌어다 놓고 글자를 두 번 클릭해 고치세요.',4500);
}
async function goHome(){finishEdit();if(dirty)await saveNow();stopPlay&&(playing=false);$('#ed').hidden=true;$('#home').hidden=false;renderHome();}
function tplCanvas(t,width){const cv=document.createElement('canvas');const d=buildTemplate(t);renderTo(cv,d,width);return{cv,d};}
function renderHome(){
  const tabs=$('#tplTabs');tabs.textContent='';
  for(const [k,l] of TCATS){const b=h('button',homeCat===k?'on':'',l);b.onclick=()=>{homeCat=k;renderHome();};tabs.append(b);}
  const g=$('#tplGrid');g.textContent='';
  const list=TEMPLATES.filter(t=>homeCat==='all'||t.c===homeCat);
  list.forEach((t,i)=>{
    const card=h('div','card');const cv=document.createElement('canvas');cv.style.aspectRatio=`${t.w}/${t.h}`;cv.style.maxHeight='260px';cv.style.objectFit='contain';
    const nm=h('div','nm');nm.append(h('b',null,t.n),h('span',null,`${t.w}×${t.h}`));
    card.append(cv,nm);if(t.c==='anim')card.append(h('span','badge','🎬 움직임'));
    card.onclick=()=>useTemplate(t);g.append(card);
    setTimeout(()=>{const d=buildTemplate(t);renderTo(cv,d,440);t._d=d;},10+i*8);
  });
  renderMine();
}
async function renderMine(){
  const ds=await listDesigns(),g=$('#mine');g.textContent='';$('#mineWrap').hidden=!ds.length;
  for(const r of ds.slice(0,30)){
    const card=h('div','card');const im=h('img');im.src=r.thumb;im.style.aspectRatio=`${r.w}/${r.h}`;im.style.objectFit='contain';im.style.maxHeight='200px';
    const nm=h('div','nm');nm.append(h('b',null,r.name),h('span',null,new Date(r.updated).toLocaleDateString()));
    const del=btn('🗑',async e=>{e.stopPropagation();if(!confirmBox(`"${r.name}"을(를) 지울까요?`))return;await idbDo('readwrite',st=>st.delete(r.id));renderMine();},'mini del');
    card.append(im,nm,del);card.onclick=async()=>{await unpack(r.data);curId=r.id;openDoc(doc,true);};g.append(card);
  }
}
function confirmBox(m){try{return window.confirm(m);}catch(e){return true;}}
/* 첫 화면 버튼 */
(function(){
  const ch=$('#sizeChips');for(const [n,w,hh] of SIZES){const c=h('button','chip',n);c.title=`${w}×${hh}`;c.onclick=()=>newBlank(w,hh,n);ch.append(c);}
  $('#nCreate').onclick=()=>newBlank(clamp(+$('#nw').value||1280,16,8000),clamp(+$('#nh').value||720,16,8000));
  $('#nOpen').onclick=()=>$('#openFile').click();
  $('#openFile').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;await openAnyFile(f);};
  $('#home').addEventListener('dragover',e=>e.preventDefault());
  $('#home').addEventListener('drop',async e=>{e.preventDefault();const f=e.dataTransfer.files[0];if(f)await openAnyFile(f);});
})();
async function openAnyFile(f){
  if(f.type.startsWith('image/')){
    const id=await loadImageBlob(f),I=imgs.get(id);curId=null;
    const d=newDoc(I.w,I.h,f.name.replace(/\.[^.]+$/,''));doc=d;d.layers.push(mkImage(id,{x:I.w/2,y:I.h/2,w:I.w,h:I.h,name:'원본 이미지'}));openDoc(d,true);return;
  }
  try{const p=JSON.parse(await f.text());if(!p.doc)throw 0;await unpack(p);curId=null;openDoc(doc,true);}catch(e){toast('열 수 없는 파일입니다');}
}
/* 위쪽 막대 */
$('#bHome').onclick=goHome;
$('#undo').onclick=undo;$('#redo').onclick=redo;
$('#dname').oninput=e=>{doc.name=e.target.value;};$('#dname').onchange=()=>commit();
$('#bResize').onclick=resizeDialog;
$('#bGuides').onclick=e=>{showGuides=!showGuides;e.currentTarget.classList.toggle('on',showGuides);requestDraw();};
$('#bSmall').onclick=e=>{showSmall=!showSmall;e.currentTarget.classList.toggle('on',showSmall);$('#smallPrev').hidden=!showSmall;requestDraw();};
$('#zIn').onclick=()=>zoomAt(1.25,stage.width/dpr/2,stage.height/dpr/2);
$('#zOut').onclick=()=>zoomAt(1/1.25,stage.width/dpr/2,stage.height/dpr/2);
$('#zFit').onclick=fitView;
addEventListener('beforeunload',()=>{if(dirty)saveNow();});

/* ================= 컷룸과 주고받기 ================= */
if(embedded){$('#bSend').hidden=false;}
addEventListener('message',async e=>{
  const m=e.data;if(!m||typeof m!=='object')return;
  if(m.type==='cutroom-studio-init'){
    const w=m.w||1280,hh=m.h||720;
    if(m.image){
      const blob=m.image instanceof Blob?m.image:dataURLtoBlob(m.image);imgs.clear();const id=await loadImageBlob(blob);curId=null;
      const d=newDoc(w,hh,m.name||'썸네일');doc=d;d.layers.push(mkImage(id,{x:w/2,y:hh/2,w,h:hh,name:'영상 장면'}));
      d.layers.push(mkText('제목을 입력하세요',{x:w/2,y:hh*.78,size:Math.round(hh*.14),fill:SOL('#ffe600'),st1:{w:Math.round(hh/60),c:'#000000'},sh:{on:true,x:0,y:Math.round(hh/90),b:0,c:'#000000',a:1}}));
      openDoc(d,true);leftTab='text';renderRail();renderLeft();toast('영상 장면으로 썸네일을 시작했습니다. 글자를 두 번 클릭해 고치세요.',4500);
    }else if(m.size){$('#nw').value=w;$('#nh').value=hh;}
  }
});
if(embedded)try{(window.opener||window.parent).postMessage({type:'cutroom-studio-ready'},'*');}catch(e){}
renderHome();
document.fonts&&document.fonts.ready.then(()=>{if(!$('#home').hidden)renderHome();});
