<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Velo 영상 편집기</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Sans+KR:wght@500;800&family=Black+Han+Sans&family=Jua&family=Do+Hyeon&family=Gaegu:wght@700&family=Nanum+Pen+Script&family=Gothic+A1:wght@400;800&family=Nanum+Gothic:wght@400;800&family=Nanum+Myeongjo:wght@400;800&family=Gowun+Dodum&family=Gowun+Batang:wght@400;700&family=Sunflower:wght@500;700&family=Gugi&family=Dongle:wght@400;700&family=Hi+Melody&family=Poor+Story&family=Single+Day&family=Stylish&family=Song+Myung&family=Yeon+Sung&family=East+Sea+Dokdo&family=Cute+Font&family=Gamja+Flower&family=Nanum+Brush+Script&family=Orbit&family=Hahmlet:wght@400;800&family=Dokdo&family=Bagel+Fat+One&family=Diphylleia&family=Black+And+White+Picture&family=Moirai+One&display=swap" rel="stylesheet">
<style>
@font-face{font-family:'Pretendard';font-weight:100 600;font-display:swap;src:url('fonts/Pretendard-Medium.woff2') format('woff2')}
@font-face{font-family:'Pretendard';font-weight:700 849;font-display:swap;src:url('fonts/Pretendard-ExtraBold.woff2') format('woff2')}
@font-face{font-family:'Pretendard';font-weight:850 1000;font-display:swap;src:url('fonts/Pretendard-Black.woff2') format('woff2')}
@font-face{font-family:'Pretendard Black';font-weight:100 1000;font-display:swap;src:url('fonts/Pretendard-Black.woff2') format('woff2')}
/* 레이아웃: 첫 화면(홈: 프로젝트 생성 배너 · 빠른 시작 · 내 작품) → 편집 작업 영역(위 패널 탭 | 프로그램 모니터 / 프로젝트·효과 | 툴 | 타임라인). 눈이 편한 회청색 어두운 테마. */
:root{
  color-scheme:dark;
  --bg:#17191f; --panel:#21242c; --panel2:#2c303b; --line:#3b404d;
  --text:#f2f4f8; --dim:#aeb5c4;
  --accent:#2fd5c5; --accent2:#4f7dff; --accent-ink:#04201d;
  --c-video:#4c87de; --c-still:#8c76d6; --c-text:#dc6aa2; --c-adj:#79819a; --c-audio:#35ad88; --danger:#ff7676;
  --font:"IBM Plex Sans KR","Noto Sans KR",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:13.5px/1.5 var(--font);overflow:hidden}
button,select,input,textarea{font:inherit;color:inherit}
button{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:4px 10px;cursor:pointer;white-space:nowrap}
button:hover:not(:disabled){border-color:var(--dim)}
button:disabled{opacity:.4;cursor:default}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
button.on{border-color:var(--accent);color:var(--accent)}
button.mini{padding:1px 7px;font-size:12px;min-width:26px}
button.ghost{background:none;border-color:transparent}
button.danger{color:var(--danger)}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
select,input[type=number],input[type=text],textarea{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:3px 7px}
input[type=range]{accent-color:var(--accent);min-width:0;flex:1}
input[type=color]{width:32px;height:24px;padding:0;border:1px solid var(--line);border-radius:5px;background:none;flex:0 0 32px}
.num{font-variant-numeric:tabular-nums}
.hint{font-size:12.5px;color:var(--dim);margin:0 0 8px}
[hidden]{display:none!important}

/* ---------- 홈 ---------- */
#home{position:fixed;inset:0;overflow:auto;padding:28px clamp(16px,3vw,44px) 40px;background:#111318}
.homeTop{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:18px;flex-wrap:wrap}
.homeTop .brand{font-size:18px;font-weight:700;margin-right:auto;order:-1;width:100%}
.homeTop .brand b{color:var(--accent)}
.homeTop select,.homeTop button{padding:8px 14px;border-radius:9px;background:var(--panel);border-color:var(--panel)}
#who{font-size:12.5px;color:var(--dim);display:flex;align-items:center;gap:8px}
#who img{width:26px;height:26px;border-radius:50%}
.hero{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:16px}
#create{width:100%;height:170px;border:0;border-radius:14px;background:linear-gradient(115deg,#25f0d8 0%,#22d0e6 45%,#4f7dff 100%);color:#061016;font-size:clamp(24px,3.4vw,40px);font-weight:700;letter-spacing:.02em;display:flex;align-items:center;justify-content:center;gap:16px}
#create:hover{filter:brightness(1.05)}
#create span{font-weight:400;font-size:1.3em;line-height:1}
.quick{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;margin-top:12px}
.quick button{background:none;border:0;border-radius:12px;padding:14px 6px;display:flex;flex-direction:column;align-items:center;gap:8px;color:#d7dbe4;white-space:normal;line-height:1.25;font-size:13.5px}
.quick button:hover,.quick button:focus-visible{background:var(--panel2)}
.quick svg{width:34px;height:34px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.side{background:var(--panel);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.side .art{height:150px;background:#000;display:grid;place-items:center}
.side .dots{display:flex;gap:6px;justify-content:center;padding:10px 0 4px}
.side .dots button{width:7px;height:7px;padding:0;border-radius:99px;background:#4a505d;border:0}
.side .dots button.on{width:22px;background:var(--accent)}
.side .txt{padding:6px 18px 18px}
.side h3{margin:0 0 6px;font-size:17px}
.side p{margin:0 0 10px;color:var(--dim);font-size:13px}
.listHead{display:flex;align-items:center;gap:6px;margin:32px 0 12px}
.listHead h2{font-size:18px;margin:0 auto 0 0}
.listHead input{width:200px}
#projGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
#projGrid.list{grid-template-columns:1fr}
.pcard{background:var(--panel);border:1px solid transparent;border-radius:12px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;position:relative;text-align:left;padding:0}
.pcard:hover,.pcard:focus-visible{border-color:var(--accent)}
.pcard .pth{aspect-ratio:16/9;background:#0b0c10 center/cover;display:grid;place-items:center;color:#59606f;font-size:12px}
.pcard .pinfo{padding:9px 11px 11px;display:flex;flex-direction:column;gap:2px}
.pcard .pname{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pcard .pmeta{font-size:12px;color:var(--dim);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.pcard .tag{font-size:11px;padding:0 7px;border-radius:99px;background:#1d4c48;color:#8ff3e7}
.pcard .tag.join{background:#2a3566;color:#b9c8ff}
.pcard .more{position:absolute;top:6px;right:6px;background:#000a;border:0;padding:2px 9px;font-size:16px;line-height:1.2}
.pcard .avs{display:flex}.pcard .avs img{width:20px;height:20px;border-radius:50%;margin-left:-5px;border:2px solid var(--panel)}
#projGrid.list .pcard{flex-direction:row;align-items:center}
#projGrid.list .pth{width:140px;flex:0 0 140px}
#projGrid.list .more{position:static;margin:0 10px 0 auto;background:var(--panel2)}
.empty{grid-column:1/-1;display:grid;place-items:center;gap:10px;padding:50px 0;color:var(--dim);text-align:center}
.empty svg{width:90px;height:80px}
#menu{position:fixed;z-index:80;background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:5px;display:none;min-width:170px;box-shadow:0 10px 30px #0008}
#menu button{display:block;width:100%;text-align:left;background:none;border:0;padding:7px 10px;border-radius:6px}
#menu button:hover{background:var(--panel)}

/* ---------- 편집기 ---------- */
#app{height:100%;display:grid;grid-template-rows:auto minmax(0,1.08fr) 6px minmax(0,1fr);gap:0}
.split{background:var(--bg);position:relative;z-index:3}
.split:hover,.split.on{background:var(--accent)}
.split.h{cursor:row-resize}.split.v{cursor:col-resize}
#top{display:flex;align-items:center;gap:6px;padding:6px 12px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
#top .sp{flex:1}
#pname{background:none;border:1px solid transparent;font-weight:600;width:200px;padding:3px 6px}
#pname:hover,#pname:focus{border-color:var(--line);background:var(--bg)}
#saveState{font-size:12px;color:var(--dim)}
#collabBar{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--dim)}
#collabBar img{width:22px;height:22px;border-radius:50%;border:2px solid var(--accent)}
.rowA{display:grid;grid-template-columns:minmax(0,1fr) 6px minmax(0,1.25fr);gap:0;min-height:0}
.rowB{display:grid;grid-template-columns:300px 6px 60px minmax(0,1fr);gap:0;min-height:0}
#tools{border-left:3px solid var(--bg);border-right:3px solid var(--bg)}
.frame{background:var(--panel);display:grid;grid-template-rows:auto minmax(0,1fr);min-height:0;min-width:0}
.tabs{display:flex;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{border:0;border-radius:0;background:none;color:var(--dim);padding:7px 11px;border-bottom:2px solid transparent}
.tabs button.on{color:var(--text);border-bottom-color:var(--accent)}
.tabs .title{padding:7px 11px;color:var(--dim)}
.body{overflow:auto;padding:10px 12px;min-height:0}
#pgmBody{display:grid;grid-template-rows:minmax(0,1fr) auto;padding:0;overflow:hidden}
#stage{display:grid;place-items:center;min-height:0;padding:8px;overflow:hidden}
#cv{background:#000;box-shadow:0 0 0 1px var(--line);touch-action:none}
#cv.type{cursor:text}
.transport{display:flex;align-items:center;justify-content:center;gap:6px;padding:5px 10px 8px;flex-wrap:wrap}
.tc{font-size:14px;color:var(--accent)}
.tc span{color:var(--dim)}
#srcView{display:grid;grid-template-rows:minmax(0,1fr) auto auto;height:100%;gap:6px}
#srcView video,#srcView .ph{width:100%;height:100%;min-height:60px;object-fit:contain;background:#000;display:grid;place-items:center;color:var(--dim)}
.row{display:flex;align-items:center;gap:6px;margin-bottom:6px}
.row>label{flex:0 0 76px;font-size:12.5px;color:var(--dim)}
.row .val{flex:0 0 50px;text-align:right;font-size:12px;font-variant-numeric:tabular-nums}
.row textarea{flex:1;min-height:58px;resize:vertical}
.row select,.row input[type=number],.row input[type=text]{flex:1;min-width:0}
.sw{width:24px;padding:0;height:22px;font-size:12px;flex:0 0 24px}
.sec{border-top:1px solid var(--line);margin-top:10px;padding-top:8px}
.sec>h3,.body>h3{font-size:12.5px;font-weight:600;margin:0 0 7px;display:flex;align-items:center;gap:6px}
.sec>h3 .sp{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px}
.subtabs{display:flex;gap:4px;margin-bottom:10px}
.subtabs button{flex:1}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:8px;margin-bottom:8px}
.gcard{padding:0;border-radius:8px;overflow:hidden;display:flex;flex-direction:column;background:var(--panel2);text-align:left}
.updbar{position:fixed;left:50%;transform:translateX(-50%);bottom:16px;z-index:60;display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:10px;background:var(--panel2,#222834);border:1px solid var(--accent,#2fd5c5);box-shadow:0 8px 28px rgba(0,0,0,.45);font-size:13px;max-width:90vw;flex-wrap:wrap}
.updbar .hint{opacity:.7;max-width:380px}
.tprog{width:160px;height:6px;border-radius:3px;background:#ffffff22;overflow:hidden}.tprog i{display:block;height:100%;width:0;background:var(--accent,#2fd5c5)}
body.picking #cv{cursor:crosshair}
.livepv{position:sticky;top:0;z-index:3;margin:0 0 8px;border-radius:8px;overflow:hidden;border:1px solid var(--line,#39404f);cursor:pointer;background:#0c0e13}.livepv canvas{width:100%;height:130px;object-fit:contain;display:block}
.gcard canvas{width:100%;aspect-ratio:16/9;display:block;background:#0c0e13}
.gcard span{padding:4px 8px;font-size:12px;white-space:normal;line-height:1.3}
.gcard.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.stk{display:flex;align-items:center;gap:6px;margin:0 0 6px 0}
.stk .lbl{flex:0 0 76px;font-size:12.5px;color:var(--dim)}
#binBar{display:flex;gap:5px;margin-bottom:8px;flex-wrap:wrap}
#binList{display:flex;flex-direction:column;gap:5px}
#binList.grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.src{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:7px;align-items:center;padding:4px;border:1px solid var(--line);border-radius:6px;background:var(--panel2);cursor:grab;user-select:none;touch-action:none}
.src.cur{border-color:var(--accent)}
.src .th{width:52px;height:30px;border-radius:3px;background:#000 center/cover;display:grid;place-items:center;font-size:11px;color:var(--dim)}
.src .nm{font-size:12.5px;overflow-wrap:anywhere;line-height:1.2}
.src .meta{font-size:11px;color:var(--dim)}
.src.off .nm{color:var(--danger)}
#binList.grid .src{grid-template-columns:1fr;text-align:center}
#binList.grid .src .th{width:100%;height:54px}
#binList.grid .src button{display:none}
.fxItem{display:flex;align-items:center;gap:6px;padding:3px 0}
.fxItem span{flex:1}
#ghost{position:fixed;pointer-events:none;z-index:70;background:var(--accent);color:var(--accent-ink);padding:2px 8px;border-radius:4px;font-size:12px;display:none}
#tools{background:var(--panel);display:flex;flex-direction:column;gap:4px;padding:6px 4px}
#tools button{padding:5px 0;font-size:11.5px;line-height:1.2;white-space:normal}
#tools button b{display:block;font-size:14px}
#tlFrame{grid-template-rows:auto minmax(0,1fr)!important}
#tlBar{display:flex;align-items:center;gap:6px;padding:6px 10px;border-bottom:1px solid var(--line);flex-wrap:wrap;background:#1b1e25}
#tlTc{font:600 19px/1 var(--font);color:#4c9bff;font-variant-numeric:tabular-nums;letter-spacing:.02em;min-width:128px}
.ib{width:34px;height:30px;padding:0;display:inline-grid;place-items:center;background:#2b2f39;border:1px solid #3a404d;border-radius:6px;color:#cfd5e1}
.ib svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ib.on{background:#3b4a63;color:#9cc8ff;border-color:#4c9bff}
.tlwrap{display:grid;grid-template-columns:minmax(0,1fr) 92px;min-height:0}
#meter{background:#14161b;border-left:1px solid var(--line);display:grid;grid-template-rows:minmax(0,1fr) auto;min-height:0}
#meterCv{width:100%;height:100%;display:block}
#meterTxt{font:11.5px var(--font);color:#cfd5e1;padding:4px 8px 8px;font-variant-numeric:tabular-nums;border-top:1px solid var(--line)}
#meterTxt div{display:flex;justify-content:space-between}
#tlBar .sp{flex:1}
#tlBar label{font-size:12px;color:var(--dim)}
#zoom{flex:0 0 110px}
#tl{display:grid;grid-template-columns:196px minmax(0,1fr);overflow-y:auto;min-height:0;align-content:start;background:#17191f}
#tlHead>div{font-size:12px;color:var(--dim);display:flex;align-items:center;gap:6px;padding:0 8px 0 6px;border-bottom:1px solid #2a2e38;background:#1e2128}
.th-tgt,.th-id{width:30px;height:28px;border-radius:5px;border:0;padding:0;font:700 12px var(--font);color:#fff;background:#2f3542;flex:0 0 30px}
.th-tgt.on,.th-id{background:#2f6fe4}
.th-id.a{background:#2f6fe4}
.th-ic{width:24px;height:24px;padding:0;border:0;background:none;color:#9aa3b5;display:grid;place-items:center;flex:0 0 24px;font:700 11.5px var(--font)}
.th-ic svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8}
.th-ic.on{color:#ffd166}.th-ic.ms{border:1px solid #4a5162;border-radius:4px;width:22px;height:20px}
.th-ic.ms.on{background:#ffd166;color:#111;border-color:#ffd166}
.th-ic.ms.solo.on{background:#4cd964;border-color:#4cd964}
.th-name{color:#d6dbe6;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#tlHead>div.gap,.track.gap{background:var(--bg)}
#tlScroll{overflow-x:auto;overflow-y:hidden;border-left:1px solid var(--line)}
#tlInner{position:relative;min-width:100%}
#tlInner.tC .clip{cursor:crosshair}
#tlInner.tA .clip,#tlInner.tA .track{cursor:e-resize}
.ruler{height:34px;position:relative;overflow:hidden;border-bottom:1px solid var(--line);cursor:ew-resize;user-select:none;background:#1b1e25}
.mark{position:absolute;top:2px;width:10px;height:13px;margin-left:-5px;background:#4c9bff;clip-path:polygon(0 0,100% 0,100% 65%,50% 100%,0 65%);cursor:pointer;z-index:4}
.mark.in{background:#ff8a3d}
.tick{position:absolute;bottom:0;height:12px;border-left:1px solid #5a6172;font-size:11px;color:#aab1c1;font-variant-numeric:tabular-nums}
.tick span{position:absolute;bottom:13px;left:3px;white-space:nowrap}
.tick.mi{height:6px;border-color:#3e4453}
.track{position:relative;border-bottom:1px solid #2a2e38;background:#1a1d24}
.track.lock{background:repeating-linear-gradient(135deg,#1a1d24 0 8px,#20232b 8px 16px)}
.track.off{opacity:.4}
.clip{position:absolute;top:2px;bottom:2px;border-radius:4px;overflow:hidden;font-size:12px;color:#fff;cursor:grab;user-select:none;touch-action:none;border:1px solid #ffffff2a;display:flex;align-items:flex-start}
.clip .hdr{position:absolute;left:0;right:0;top:0;height:18px;background:#0004;pointer-events:none}
.clip .strip{position:absolute;left:0;right:0;top:18px;bottom:0;display:flex;overflow:hidden;pointer-events:none}
.clip .strip i{flex:0 0 auto;height:100%;background:#000 center/cover;border-right:1px solid #0006}
.clip canvas.wv{position:absolute;left:0;top:18px;pointer-events:none}
.clip.video{background:#24597d} .clip.image,.clip.sample{background:var(--c-still)} .clip.text{background:var(--c-text)}
.clip.shape{background:#c98a2e} .clip.adj{background:var(--c-adj)} .clip.audio{background:#1f4a66}
.clip.audio.music{background:#3f5f20}
.clip.sel{border-color:#fff;box-shadow:0 0 0 1px #4c9bff, inset 0 0 0 1px #fff}
.clip .lb{padding:1px 7px;line-height:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none;text-shadow:0 1px 2px #0008;position:relative}
.clip .thumb{flex:0 0 auto;height:100%;aspect-ratio:16/9;background:#0006 center/cover;pointer-events:none}
.clip .hl,.clip .hr{position:absolute;top:0;bottom:0;width:7px;cursor:ew-resize;background:#fff3;z-index:2}
.clip .hl{left:0}.clip .hr{right:0}
.clip .hl:hover,.clip .hr:hover{background:#fff9}
.clip .tri,.clip .tro{position:absolute;top:0;bottom:0;background:repeating-linear-gradient(135deg,#fff5 0 4px,#fff2 4px 8px);pointer-events:none}
.clip .tri{left:0}.clip .tro{right:0}
.clip .wave{position:absolute;left:0;right:0;top:50%;height:40%;transform:translateY(-50%);background:repeating-linear-gradient(90deg,#ffffff40 0 2px,transparent 2px 5px);pointer-events:none;mask:linear-gradient(#000,#000)}
.clip .anb,.clip .ane{position:absolute;bottom:0;height:7px;background:#ffd84a;z-index:3;cursor:ew-resize;border-radius:2px;opacity:.9}
.clip .anb{left:0}.clip .ane{right:0}
.clip .anb:hover,.clip .ane:hover{opacity:1;height:9px}
.clip .kf{position:absolute;bottom:9px;width:9px;height:9px;background:#fff;transform:translateX(-50%) rotate(45deg);border:1px solid #0008;z-index:3;cursor:pointer}
.clip .kf.ease{border-radius:50%;transform:translateX(-50%);background:#ffd25a}
.clip .kf.hold{transform:translateX(-50%);background:#ff7a7a;border-radius:1px}
.clip .kf.sel{outline:2px solid var(--accent,#2fd5c5);outline-offset:1px}
.kfa .props{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.kfa .props button.on{background:var(--accent,#2fd5c5);color:#062}
.kfa .klist{display:flex;flex-direction:column;gap:3px;margin:6px 0 10px}
.kfa .krow{display:grid;grid-template-columns:62px 58px 1fr;gap:6px;align-items:center;padding:4px 6px;border-radius:6px;background:#ffffff08;cursor:pointer;font-size:12px}
.kfa .krow.on{background:#2fd5c522;outline:1px solid var(--accent,#2fd5c5)}
.kfa .krow select{font-size:12px}
.kfa .curve{display:grid;grid-template-columns:1fr;gap:6px}
.kfa canvas{width:100%;border-radius:8px;background:#11151d;display:block;touch-action:none}

    b.append(h('p','hint',IS_APP?'PC 앱에서는 작품이 이 컴퓨터에만 저장됩니다. 공동 작업은 Velo 웹 사이트에서 로그인한 뒤 할 수 있습니다.':'Claude 계정으로 로그인하면 작품이 계정에 저장되고 공동 작업을 할 수 있습니다. 계정이 없으면 claude.ai에서 무료로 가입한 뒤 이 페이지를 다시 열어 주세요.'));
    const a=h('div','acts'),c=h('button','primary','확인');c.onclick=closeModal;a.append(c);b.append(a);});

async function startCollab(rec){
  if(store.mode==='fb'){if(!cur||cur.id!==rec.id){await fbOpen(rec);}fbCollabDialog();return;}
  if(fb.on&&!fb.user){fbAuthDialog('login');return;}
  if(store.mode!=='cloud'){needLogin();return;}
  if(rec.collab){showCollabHelp();return;}
  const open=cur&&cur.id===rec.id;
  if(open){await saveNow(true);rec=recordOf();}
  const d=Object.assign({},rec,{collab:true,owner:store.uid,members:[store.uid],rev:Date.now(),sess:SESSION});
  try{await sharedDoc(rec.id).set(d);await myDoc(rec.id).delete();}
  catch(e){toast(e&&e.code==='quota_exceeded'?'저장 공간이 가득 차서 공동 작업으로 옮기지 못했습니다.':'공동 작업을 시작하지 못했습니다. 이 페이지의 편집 권한이 있는지 확인해 주세요.');return;}
  if(open){cur.collab=true;cur.owner=store.uid;cur.members=[store.uid];appliedRev=d.rev;watchRemote();renderCollabBar();
    const big=Object.values(S).filter(s=>s.file&&s.file.size>20*1048576).length;
    Object.values(S).forEach(shareMedia);if(big)toast(`20MB가 넘는 파일 ${big}개는 공유되지 않습니다. 함께하는 사람도 같은 파일을 가져오면 자동으로 연결됩니다.`);}
  showCollabHelp();
}
function showCollabHelp(){
  modal(b=>{b.append(h('h3',null,'👥 공동 작업이 켜졌습니다'));
    const ol=h('ol');
    ['이 페이지 오른쪽 위의 공유 메뉴에서 함께할 사람을 초대하세요. 편집하려면 편집자(Editor) 또는 기여자(Contributor) 권한이 필요합니다.',

async function joinProject(rec){
  try{if(!(rec.members||[]).includes(store.uid))await sharedDoc(rec.id).update({members:[...(rec.members||[]),store.uid]});}
  catch(e){toast('참여하지 못했습니다. 작품 주인에게 편집 권한을 요청하세요.');return;}
  rec=Object.assign({},rec,{members:[...(rec.members||[]),store.uid]});openProject(rec,false);
}
async function deleteProject(rec){
  modal(b=>{b.append(h('h3',null,`'${rec.name}' 삭제`));
    b.append(h('p','hint',rec.collab?'공동 작업 작품을 지우면 모든 참여자에게서 사라집니다. 원본 영상 파일은 그대로 남습니다.':'작품이 지워집니다. 원본 영상 파일은 그대로 남습니다.'));
    const a=h('div','acts'),c=h('button',null,'취소'),g=h('button','primary','삭제');c.onclick=closeModal;
    g.onclick=async()=>{closeModal();try{
      if(store.mode==='fb'){const d=(await fb.db.ref('projects/'+rec.id).get()).val();const up={};
        if(d&&d.owner===fb.user.uid){up['projects/'+rec.id]=null;for(const u of memList(d.members))up[`userProjects/${u}/${rec.id}`]=null;}
        else{up[`projects/${rec.id}/members/${fb.user.uid}`]=null;up[`userProjects/${fb.user.uid}/${rec.id}`]=null;}
        await fb.db.ref().update(up);toast('삭제했습니다.');return;}
      if(rec.collab)await sharedDoc(rec.id).delete();else if(store.mode==='cloud')await myDoc(rec.id).delete();
      else{const all=lsGet('cutroom.projects',{});delete all[rec.id];lsSet('cutroom.projects',all);projects.mine=Object.values(all);renderHome();}
      toast('삭제했습니다.');}catch(e){toast('삭제하지 못했습니다.');}};
    a.append(c,g);b.append(a);});
}
async function leaveProject(rec){
  if(store.mode==='fb'){const up={};up[`projects/${rec.id}/members/${fb.user.uid}`]=null;up[`userProjects/${fb.user.uid}/${rec.id}`]=null;try{await fb.db.ref().update(up);toast('공동 작업에서 나왔습니다.');}catch(e){toast('나가지 못했습니다.');}return;}
  try{await sharedDoc(rec.id).update({members:(rec.members||[]).filter(x=>x!==store.uid)});toast('공동 작업에서 나왔습니다.');}catch(e){toast('나가지 못했습니다.');}
}
function renameProject(rec){
  modal(b=>{b.append(h('h3',null,'이름 바꾸기'));const i=h('input');i.type='text';i.value=rec.name;i.style.width='100%';b.append(i);
    const a=h('div','acts'),c=h('button',null,'취소'),g=h('button','primary','확인');c.onclick=closeModal;
    const ok=async()=>{const n=i.value.trim();if(!n)return;closeModal();
      try{if(store.mode==='fb'){const d=(await fb.db.ref('projects/'+rec.id).get()).val();const up={};up[`projects/${rec.id}/name`]=n;for(const u of memList(d&&d.members))up[`userProjects/${u}/${rec.id}/name`]=n;await fb.db.ref().update(up);}
        else if(rec.collab)await sharedDoc(rec.id).update({name:n});else if(store.mode==='cloud')await myDoc(rec.id).update({name:n});
        else{const all=lsGet('cutroom.projects',{});if(all[rec.id])all[rec.id].name=n;lsSet('cutroom.projects',all);projects.mine=Object.values(all);renderHome();}}
      catch(e){toast('이름을 바꾸지 못했습니다.');}};
    g.onclick=ok;i.onkeydown=e=>{if(e.key==='Enter')ok();};a.append(c,g);b.append(a);setTimeout(()=>{i.focus();i.select();},0);});
}
async function dupProject(rec){
  if(store.mode==='fb'){try{const d=(await fb.db.ref('projects/'+rec.id).get()).val(),x=JSON.parse(d.data||'{}');const n=newRecord(rec.name+' 사본',d.w,d.h,{P:x.P,media:x.media,thumb:d.thumb});await fbWrite(n,true);toast('사본을 만들었습니다.');}catch(e){toast('사본을 만들지 못했습니다.');}return;}
  const n=newRecord(rec.name+' 사본',rec.w||1920,rec.h||1080,{P:clone(rec.P),media:clone(rec.media||[]),thumb:rec.thumb});
  try{if(store.mode==='cloud')await myDoc(n.id).set(n);else{const all=lsGet('cutroom.projects',{});all[n.id]=n;lsSet('cutroom.projects',all);projects.mine=Object.values(all);renderHome();}toast('사본을 만들었습니다.');}
  catch(e){toast('사본을 만들지 못했습니다.');}
}
function exportProjectFile(rec){
  const data=JSON.stringify({cutroom:1,name:rec.name,w:rec.w,h:rec.h,P:rec.P,media:(rec.media||[]).map(m=>Object.assign({},m,{asset:null}))});
  saveBlob(new Blob([data],{type:'application/json'}),(rec.name||'작품')+'.cutroom.json');
}
$('openFile').onclick=()=>$('projFile').click();
$('projFile').onchange=async e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;
  try{const d=JSON.parse(await f.text());if(!d.P||!Array.isArray(d.P.clips))throw 0;
    const rec=newRecord(d.name||f.name.replace(/\..*$/,''),d.w||d.P.w||1920,d.h||d.P.h||1080,{P:d.P,media:d.media||[]});await openProject(rec,true);}
  catch(err){toast('Velo 프로젝트 파일(.cutroom.json)이 아닙니다.');}
};

let sideI=0,sideT=performance.now();
function renderSide(){
  const ds=$('sideDots');ds.textContent='';SIDE.forEach((_,i)=>{const b=h('button',i===sideI?'on':'');b.setAttribute('aria-label',`${i+1}번째 소식`);b.onclick=()=>{sideI=i;sideT=performance.now();renderSide();};ds.append(b);});
  const s=SIDE[sideI],tx=$('sideTxt');tx.textContent='';tx.append(h('h3',null,s[0]),h('p',null,s[1]));
  if(!(IS_APP&&sideI===2)){const b=h('button','primary',s[2]);b.onclick=s[3];tx.append(b);}

function drawSide(now){
  if($('home').hidden)return;
  if(now-sideT>6000){sideI=(sideI+1)%SIDE.length;sideT=now;renderSide();}
  const c=$('sideArt'),g=c.getContext('2d'),w=c.width,hh=c.height,tt=now/1000;
  g.fillStyle='#000';g.fillRect(0,0,w,hh);
  for(let i=0;i<5;i++){g.globalAlpha=.25;g.fillStyle=['#25f0d8','#4f7dff','#2fd5c5','#8c76d6','#22d0e6'][i];g.beginPath();
    g.arc(w/2+Math.sin(tt*.6+i*1.3)*90,hh/2+Math.cos(tt*.5+i)*35,26+i*6,0,7);g.fill();}
  g.globalAlpha=1;g.font='700 30px "Black Han Sans",sans-serif';g.textAlign='center';g.textBaseline='middle';
  const txt=['노래방 자막','공동 작업','PC 앱'][sideI],tw=g.measureText(txt).width,p=clamp(((tt*1000-sideT/1)%6000)/2500,0,1);
  g.lineWidth=8;g.strokeStyle='#000';g.lineJoin='round';g.strokeText(txt,w/2,hh/2);g.fillStyle='#fff';g.fillText(txt,w/2,hh/2);
  if(sideI===0){g.save();g.beginPath();g.rect(w/2-tw/2,0,tw*p,hh);g.clip();g.fillStyle='#ffe14a';g.fillText(txt,w/2,hh/2);g.restore();}
}

function openMenu(e,r,kind){

  if(store.mode==='fb')it('👥 아이디로 초대해 공동 작업',()=>startCollab(r));
  else if(kind==='mine'&&!CAN_P2P)it('👥 공동 작업 시작',()=>startCollab(r));
  if(kind==='mine'&&CAN_P2P)it('🖧 서버 열어 공동 작업 (코드)',async()=>{store.mode==='fb'?await fbOpen(r):await openProject(r,false);p2pHost();});
  if(kind!=='mine')it('공동 작업 안내',showCollabHelp);
  if(kind!=='join')it('이름 바꾸기',()=>renameProject(r));
  it('사본 만들기',()=>dupProject(r));
  it('프로젝트 파일로 저장',()=>exportProjectFile(r));
  if((kind==='collab'||(store.mode==='fb'&&r.collab))&&r.owner!==store.uid)it('공동 작업에서 나가기',()=>leaveProject(r));
  if(kind==='mine'||r.owner===store.uid)it('삭제',()=>deleteProject(r),'danger');
  m.style.display='block';const R=m.getBoundingClientRect();
  m.style.left=Math.min(e.clientX,innerWidth-R.width-8)+'px';m.style.top=Math.min(e.clientY,innerHeight-R.height-8)+'px';
}

  modal(b=>{b.append(h('h3',null,p.name?'내 계정':'앱 로그인'));
    b.append(h('p','hint','공동 작업에서 다른 사람에게 보일 이름과 색입니다. 이 컴퓨터에 저장됩니다.'));
    const n=h('input');n.type='text';n.value=p.name||'';n.placeholder='닉네임';n.maxLength=20;
    const col=h('input');col.type='color';col.value=p.color||'#2fd5c5';
    b.append(row('닉네임',n),row('내 색',col));
    const a=h('div','acts'),c=h('button',null,'취소'),g=h('button','primary',p.name?'저장':'로그인');c.onclick=closeModal;a.append(c);
    if(p.name){const o=h('button','danger','로그아웃');o.onclick=()=>{try{localStorage.removeItem('cutroom.profile');}catch(e){}closeModal();renderHome();toast('로그아웃했습니다.');};a.prepend(o);}
    const ok=()=>{const nm=n.value.trim();if(!nm){toast('닉네임을 입력하세요.');n.focus();return;}
      lsSet('cutroom.profile',{name:nm,color:col.value,id:p.id||rid('u')});closeModal();renderHome();if(cur)renderCollabBar();toast(nm+'님으로 로그인했습니다.');after&&after();};
    g.onclick=ok;n.onkeydown=e=>{if(e.key==='Enter')ok();};a.append(g);b.append(a);setTimeout(()=>n.focus(),0);});
}
let net={peer:null,role:null,conns:[],host:null,code:null,people:{},asked:new Set()};
const peerOK=()=>typeof window.Peer==='function';
function p2pReset(){clearCursors();try{net.peer&&net.peer.destroy();}catch(e){}net={peer:null,role:null,conns:[],host:null,code:null,people:{},asked:new Set()};if(cur)renderCollabBar();}
function p2pSend(msg,except){
  try{if(net.role==='host')net.conns.forEach(c=>{if(c!==except&&c.open)c.send(msg);});
  else if(net.role==='guest'&&net.host&&net.host.open)net.host.send(msg);}catch(e){}
}
function p2pPeople(){p2pSend({type:'people',people:net.people});renderCollabBar();}
async function p2pSendFile(s,to){
  if(!s||!s.file)return;if(s.file.size>300*1048576){toast(`${s.name}: 300MB가 넘어 공유하지 않습니다. 같은 파일을 각자 가져오세요.`);return;}
  const msg={type:'file',id:s.id,meta:Object.assign({},mediaMeta().find(m=>m.id===s.id)),mime:s.file.type,buf:await s.file.arrayBuffer()};
  try{if(to)to.send(msg);else p2pSend(msg);}catch(e){}
}
function p2pNeedMedia(){for(const s of Object.values(S)){if(s.offline&&!net.asked.has(s.id)){net.asked.add(s.id);p2pSend({type:'need',id:s.id});}}}
function p2pHost(){
  if(!cur){toast('먼저 작품을 열어 주세요.');return;}
  if(!fb.profile&&!prof()){fb.on?fbAuthDialog('login'):appLogin(p2pHost);return;}
  if(!peerOK()){toast('공동 작업 모듈을 불러오지 못했습니다. 인터넷 연결을 확인한 뒤 앱을 다시 켜 주세요.');return;}
  if(net.role){p2pDialog();return;}
  const code=String(Math.floor(100000+Math.random()*900000)),peer=new Peer('cutroom-kr-'+code,window.PEER_OPTS);
  toast('서버를 여는 중…');
  peer.on('open',()=>{net.peer=peer;net.role='host';net.code=code;net.people={me:prof()};renderCollabBar();p2pDialog();});
  peer.on('connection',conn=>{
    conn.on('data',d=>p2pOnData(conn,d));
    conn.on('close',()=>{const p=net.people[conn.peer];net.conns=net.conns.filter(c=>c!==conn);delete net.people[conn.peer];p2pPeople();if(p)toast(p.name+'님이 나갔습니다.');});
  });
  peer.on('error',e=>{if(e.type==='unavailable-id'){peer.destroy();p2pHost();return;}if(net.role!=='host')peer.destroy();toast('서버 오류: '+(e.type==='network'||e.type==='server-error'?'인터넷 연결을 확인해 주세요.':e.type));});
}
function p2pJoin(code){
  code=String(code||'').replace(/\D/g,'');
  if(code.length!==6){toast('6자리 숫자 코드를 입력하세요.');return;}
  if(!fb.profile&&!prof()){fb.on?fbAuthDialog('login'):appLogin(()=>p2pJoin(code));return;}
  if(!peerOK()){toast('공동 작업 모듈을 불러오지 못했습니다. 인터넷 연결을 확인한 뒤 앱을 다시 켜 주세요.');return;}
  if(net.role)p2pReset();
  toast('서버에 연결하는 중…');
  const peer=new Peer(window.PEER_OPTS);
  peer.on('open',()=>{
    const conn=peer.connect('cutroom-kr-'+code,{reliable:true});
    const tm=setTimeout(()=>{if(net.role!=='guest'){toast('서버에 연결하지 못했습니다. 코드와, 서버를 연 사람의 앱이 켜져 있는지 확인하세요.');try{peer.destroy();}catch(e){}}},15000);
    conn.on('open',()=>{clearTimeout(tm);net.peer=peer;net.role='guest';net.host=conn;net.code=code;conn.send({type:'join',prof:prof()});});
    conn.on('data',d=>p2pOnData(conn,d));
    conn.on('close',()=>{if(net.role==='guest'){toast('서버 연결이 끊겼습니다. 작품은 이 컴퓨터에 사본으로 남아 있습니다.');p2pReset();}});
  });
  peer.on('error',e=>{toast(e.type==='peer-unavailable'?'그 코드로 열린 서버가 없습니다.':'연결 오류: '+e.type);try{peer.destroy();}catch(x){}});
}
async function p2pOnData(conn,d){
  if(!d||!d.type)return;
  if(d.type==='join'&&net.role==='host'){
    net.conns.push(conn);net.people[conn.peer]=d.prof;
    await saveNow(true);conn.send({type:'hello',rec:recordOf(),people:net.people});p2pPeople();toast((d.prof&&d.prof.name||'누군가')+'님이 들어왔습니다.');
  }else if(d.type==='hello'&&net.role==='guest'){
    const keep=net;net.people=d.people;
    await openProject(Object.assign({},d.rec,{collab:false}),true);net=keep;
    renderCollabBar();p2pNeedMedia();toast('공동 작업에 참여했습니다. 영상 파일을 받는 중…');closeModal();
  }else if(d.type==='state'){
    if(net.role==='host')p2pSend(d,conn);
    if(d.sess===SESSION||!cur)return;
    if(busy||exporting){pendingRemote=d;return;}
    await applyRemote(d);
  }else if(d.type==='people'){net.people=d.people;renderCollabBar();}
  else if(d.type==='cur'){if(net.role==='host')p2pSend(d,conn);if(d.sess!==SESSION)gotCursor(d.sess,d.c);}
  else if(d.type==='need'){const s=S[d.id];if(s&&s.file)p2pSendFile(s,conn);}
  else if(d.type==='file'){
    if(net.role==='host')p2pSend(d,conn);
    let s=S[d.id];if(!s&&d.meta){s=S[d.id]=Object.assign({},d.meta);}if(!s||(s.file&&!s.offline))return;
    const blob=new Blob([d.buf],{type:d.mime||''});attach(s,blob);try{await idbDo('readwrite',st=>st.put(blob,s.id));}catch(e){}
    if(cur){renderPanels();renderTimeline();}toast(s.name+' 파일을 받았습니다.');
  }
}

  modal(b=>{
    if(net.role==='host'){
      b.append(h('h3',null,'🖧 서버가 열렸습니다'),h('p','hint','함께할 사람에게 이 코드를 알려 주세요. 그 사람은 Velo 앱 첫 화면의 "서버 참여"에 코드를 넣으면 됩니다.'),h('div','code',net.code));

      x.onclick=()=>{p2pReset();closeModal();toast('서버를 닫았습니다.');};cp.onclick=()=>{navigator.clipboard&&navigator.clipboard.writeText(net.code).then(()=>toast('코드를 복사했습니다.'),()=>{});};ok.onclick=closeModal;
      a.append(x,cp,ok);b.append(a);return;
    }
    if(net.role==='guest'){
      b.append(h('h3',null,'🖧 공동 작업 참여 중'),h('div','code',net.code));
      const a=h('div','acts'),x=h('button','danger','나가기'),ok=h('button','primary','확인');x.onclick=()=>{p2pReset();closeModal();toast('공동 작업에서 나왔습니다.');};ok.onclick=closeModal;a.append(x,ok);b.append(a);return;
    }
    b.append(h('h3',null,'공동 작업'));
    if(cur){const o=h('button','primary','🖧 이 작품으로 서버 열기');o.style.width='100%';o.onclick=()=>{closeModal();p2pHost();};
      b.append(h('p','hint','서버를 열면 6자리 코드가 나옵니다. 같은 코드를 넣은 사람과 이 작품을 실시간으로 함께 편집합니다.'),o,h('div','sec'));}
    const i=h('input');i.type='text';i.inputMode='numeric';i.maxLength=7;i.placeholder='123456';
    b.append(h('p','hint','다른 사람이 연 서버에 참여하기'),row('참여 코드',i));
    const a=h('div','acts'),c=h('button',null,'취소'),g=h('button',cur?'':'primary','참여');c.onclick=closeModal;g.onclick=()=>p2pJoin(i.value);
    i.onkeydown=e=>{if(e.key==='Enter')p2pJoin(i.value);};a.append(c,g);b.append(a);
  });
}


/* ================= 공동 작업자 마우스 ================= */
const rcur={};let curSent=0,lastCur=null;
function myCursorInfo(e){
  const tl=$('tlInner'),r=cv.getBoundingClientRect();
  if(tl&&tl.isConnected&&tl.contains(e.target)){const tr=rowAt(e.clientY);if(tr){const el=tl.querySelector(`.track[data-tr="${tr}"]`).getBoundingClientRect();return {a:'tl',tm:+timeAt(e).toFixed(3),tr,fy:+((e.clientY-el.top)/el.height).toFixed(3)};}}
  if(e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom)return {a:'cv',x:+((e.clientX-r.left)/r.width).toFixed(4),y:+((e.clientY-r.top)/r.height).toFixed(4)};
  return {a:'none'};
}
addEventListener('pointermove',e=>{
  if(!cur)return;const n=performance.now();if(n-curSent<70)return;curSent=n;
  const info=myCursorInfo(e),key=JSON.stringify(info);if(key===lastCur)return;lastCur=key;
  const me=myProfile();info.name=me.name;info.color=me.color;info.ts=Date.now();
  if(net.role)p2pSend({type:'cur',sess:SESSION,c:info});
  if(fb.on&&cur.collab&&fb.user)fbCursor(info);
});
function gotCursor(id,c){if(!c){delete rcur[id];return;}rcur[id]=Object.assign({},c,{seen:Date.now()});}
function drawCursors(){
  const now=Date.now(),live=new Set();
  for(const[id,c]of Object.entries(rcur)){
    if(now-c.seen>8000||c.a==='none'){continue;}
    let x=null,y=null;
    if(c.a==='cv'){const r=cv.getBoundingClientRect();x=r.left+c.x*r.width;y=r.top+c.y*r.height;}
    else if(c.a==='tl'){const tl=$('tlInner'),tr=tl&&tl.querySelector(`.track[data-tr="${c.tr}"]`);if(tr){const ir=tl.getBoundingClientRect(),er=tr.getBoundingClientRect(),sr=$('tlScroll').getBoundingClientRect();
      x=ir.left+c.tm*pps;y=er.top+c.fy*er.height;if(x<sr.left||x>sr.right)x=null;}}
    if(x==null)continue;live.add(id);
    let el=document.getElementById('rc-'+id);
    if(!el){el=h('div','rcur');el.id='rc-'+id;el.innerHTML='<svg viewBox="0 0 18 18"><path d="M2 1l13 7-6 1.5L6.5 16z" stroke="#fff" stroke-width="1.2"/></svg>';el.append(h('span'));document.body.append(el);}
    el.querySelector('path').setAttribute('fill',c.color||'#ff3dbb');const sp=el.querySelector('span');sp.textContent=c.name||'참여자';sp.style.background=c.color||'#ff3dbb';
    el.style.left=x+'px';el.style.top=y+'px';
  }
  document.querySelectorAll('.rcur').forEach(el=>{if(!live.has(el.id.slice(3)))el.remove();});
}
function clearCursors(){for(const k in rcur)delete rcur[k];document.querySelectorAll('.rcur').forEach(e=>e.remove());}

/* ================= Firebase: Velo 계정 · 작품 저장 · 공동 작업 ================= */
const fb={on:false,user:null,db:null,auth:null,profile:null,peer:null,asked:new Set(),offs:[]};
const FBV='10.12.2';
function loadScript(src){return new Promise((res,rej)=>{const s2=document.createElement('script');s2.src=src;s2.onload=res;s2.onerror=rej;document.head.append(s2);});}
async function initFirebase(){
  const cfg=window.CUTROOM_FB;if(!cfg||!cfg.apiKey)return false;
  try{
    if(!window.firebase)for(const m of ['app','auth','database'])await loadScript(`https://www.gstatic.com/firebasejs/${FBV}/firebase-${m}-compat.js`);
    firebase.initializeApp(cfg);fb.auth=firebase.auth();fb.db=firebase.database();fb.on=true;
    await new Promise(r=>{const un=fb.auth.onAuthStateChanged(u=>{un();r();});});
    if(fb.auth.currentUser)await fbAfterLogin(fb.auth.currentUser,true);
    return true;
  }catch(e){console.warn('firebase',e);fb.on=false;return false;}
}
const fbEmail=id=>id.toLowerCase()+'@users.cutroom.app';
async function fbAfterLogin(u,silent){
  fb.user=u;const snap=await fb.db.ref('profiles/'+u.uid).get();fb.profile=snap.val()||{name:u.email.split('@')[0],color:'#2fd5c5',id:u.email.split('@')[0]};
  store.mode='fb';store.uid=u.uid;store.me=null;
  if(!silent){toast(fb.profile.name+'님, 환영합니다.');offerMigrate();}
  listen();
}
function myProfile(){if(fb.profile)return fb.profile;const p=prof();if(p)return p;if(store.me)return {name:store.me.name||'참여자',color:store.me.color||'#2fd5c5'};return {name:'참여자',color:'#2fd5c5'};}
const FB_ERR={'auth/invalid-credential':'아이디 또는 비밀번호가 맞지 않습니다.','auth/wrong-password':'아이디 또는 비밀번호가 맞지 않습니다.','auth/user-not-found':'없는 아이디입니다.',
  'auth/email-already-in-use':'이미 있는 아이디입니다.','auth/weak-password':'비밀번호는 6자 이상이어야 합니다.','auth/too-many-requests':'시도가 너무 많습니다. 잠시 뒤 다시 해 주세요.','auth/network-request-failed':'인터넷 연결을 확인해 주세요.'};
function fbAuthDialog(mode){
  mode=mode||'login';
  if(fb.user){
    modal(b=>{b.append(h('h3',null,'내 계정'));const p=fb.profile;
      b.append(h('p','hint',`아이디: ${p.id} · 닉네임: ${p.name}`));
      const n=h('input');n.type='text';n.value=p.name;n.maxLength=20;const col=h('input');col.type='color';col.value=p.color||'#2fd5c5';
      b.append(row('닉네임',n),row('내 색',col));
      const a=h('div','acts'),o=h('button','danger','로그아웃'),c=h('button',null,'닫기'),g=h('button','primary','저장');
      o.onclick=async()=>{await fb.auth.signOut();fb.user=null;fb.profile=null;store.mode='local';store.uid=null;closeModal();listen();toast('로그아웃했습니다.');};
      c.onclick=closeModal;g.onclick=async()=>{fb.profile=Object.assign({},p,{name:n.value.trim()||p.name,color:col.value});await fb.db.ref('profiles/'+fb.user.uid).set(fb.profile);closeModal();renderHome();toast('저장했습니다.');};
      a.append(o,c,g);b.append(a);});return;
  }
  modal(b=>{
    const tabs=h('div','subtabs');for(const[k,n]of [['login','로그인'],['signup','회원가입']]){const t2=h('button',mode===k?'on':'',n);t2.onclick=()=>fbAuthDialog(k);tabs.append(t2);}
    b.append(h('h3',null,'Velo 계정'),tabs);
    const id=h('input');id.type='text';id.placeholder='영문·숫자 3~20자';id.autocomplete='username';id.maxLength=20;
    const pw=h('input');pw.type='password';pw.placeholder='6자 이상';pw.autocomplete=mode==='login'?'current-password':'new-password';
    b.append(row('아이디',id),row('비밀번호',pw));
    let pw2,nick,col;
    if(mode==='signup'){pw2=h('input');pw2.type='password';pw2.autocomplete='new-password';nick=h('input');nick.type='text';nick.maxLength=20;nick.placeholder='다른 사람에게 보일 이름';
      col=h('input');col.type='color';col.value=['#2fd5c5','#ff5fa2','#ffb02e','#7c8cff','#4cd964'][Math.floor(Math.random()*5)];
      b.append(row('비밀번호 확인',pw2),row('닉네임',nick),row('내 색',col));}
    const msg=h('p','hint');msg.style.color='var(--danger)';b.append(msg);
    b.append(h('p','hint','계정을 만들면 웹과 PC 앱 어디서든 같은 작품을 열고, 아이디로 다른 사람을 공동 작업에 초대할 수 있습니다.'));
    const a=h('div','acts'),c=h('button',null,'취소'),g=h('button','primary',mode==='login'?'로그인':'가입하고 로그인');c.onclick=closeModal;
    const go=async()=>{
      const uid0=id.value.trim().toLowerCase();msg.textContent='';
      if(!/^[a-z0-9_]{3,20}$/.test(uid0)){msg.textContent='아이디는 영문 소문자·숫자·밑줄(_) 3~20자로 입력하세요.';return;}
      if(pw.value.length<6){msg.textContent='비밀번호는 6자 이상이어야 합니다.';return;}
      g.disabled=true;
      try{
        if(mode==='signup'){
          if(pw.value!==pw2.value)throw {code:'x',message:'비밀번호 확인이 다릅니다.'};
          const taken=(await fb.db.ref('usernames/'+uid0).get()).exists();if(taken)throw {code:'auth/email-already-in-use'};
          const cr=await fb.auth.createUserWithEmailAndPassword(fbEmail(uid0),pw.value);
          await fb.db.ref('usernames/'+uid0).set(cr.user.uid);
          await fb.db.ref('profiles/'+cr.user.uid).set({id:uid0,name:nick.value.trim()||uid0,color:col.value});
          closeModal();await fbAfterLogin(cr.user);
        }else{
          const cr=await fb.auth.signInWithEmailAndPassword(fbEmail(uid0),pw.value);closeModal();await fbAfterLogin(cr.user);
        }
      }catch(e){msg.textContent=(e&&FB_ERR[e.code])||(e&&e.message)||'다시 시도해 주세요.';g.disabled=false;}
    };
    g.onclick=go;[id,pw,pw2].forEach(x=>x&&(x.onkeydown=e=>{if(e.key==='Enter')go();}));a.append(c,g);b.append(a);setTimeout(()=>id.focus(),0);
  });
}
function offerMigrate(){
  const local=Object.values(lsGet('cutroom.projects',{}));if(!local.length)return;
  modal(b=>{b.append(h('h3',null,'이 기기의 작품을 계정으로 옮길까요?'),h('p','hint',`이 기기에만 저장된 작품 ${local.length}개를 계정에 올립니다. 영상 원본은 이 기기에 그대로 있습니다.`));
    const a=h('div','acts'),c=h('button',null,'나중에'),g=h('button','primary','옮기기');c.onclick=closeModal;
    g.onclick=async()=>{closeModal();let n=0;for(const r of local){try{await fbWrite(Object.assign({},r,{owner:fb.user.uid,members:[fb.user.uid],collab:false}),true);n++;}catch(e){}}
      if(n===local.length){try{localStorage.removeItem('cutroom.projects');}catch(e){}}toast(`작품 ${n}개를 계정으로 옮겼습니다.`);};

async function startExport(f,bps){
  wake();setPlaying(false);t=0;exporting=true;expCancel=false;expMime=f;chunks=[];
  modal(b=>{
    b.append(h('h3',null,'내보내는 중…'));const bar=h('div','bar'),i=h('i');bar.append(i);b.append(bar);

  });
  const until=performance.now()+3000;
  while(performance.now()<until){
    const bz=P.clips.some(c=>{if(c.kind!=='video'||!(0>=c.start&&0<end(c)))return false;const m=mediaFor(c);return m&&(m.el.readyState<2||m.el.seeking);});

  }catch(e){exporting=false;clearInterval(progTimer);closeModal();toast('녹화를 시작하지 못했습니다. 다른 형식을 골라 보세요.');return;}
  rec.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data);};
  rec.onstop=()=>{clearInterval(progTimer);exporting=false;expQ=false;applySize();rec.stream.getVideoTracks().forEach(x=>x.stop());
    if(expCancel){closeModal();return;}
    expBlob=new Blob(chunks,{type:f.mime.split(';')[0]});if(expUrl)URL.revokeObjectURL(expUrl);expUrl=URL.createObjectURL(expBlob);showResult();};
  rec.start(1000);setPlaying(true);
}

function presetOnto(c,p,fit){
  const f=fit&&p.dur>0?dur(c)/p.dur:1;
  for(const[k,v]of Object.entries(p.props||{})){
    if(k==='vol'&&!hasAudio(c))continue;if(k!=='vol'&&!isVis(c))continue;
    const nv=clone(v);nv.k.forEach(q=>q[0]=+(q[0]*f).toFixed(3));
    if(['x','y','rot'].includes(k)&&nv.k.length){const cv0=isAnim(c,k)?val(c,k,0):c[k],d0=cv0-nv.k[0][1];nv.k.forEach(q=>q[1]=+(q[1]+d0).toFixed(2));}
    c[k]=nv;
  }
  if(c.kind==='text'&&p.ain!=null){c.ain=p.ain;c.aout=p.aout;c.ainD=Math.min(p.ainD,dur(c));c.aoutD=Math.min(p.aoutD,dur(c));}
  if(isVis(c)){if(p.tin)c.tin=clone(p.tin);if(p.tout)c.tout=clone(p.tout);}
}

}

addEventListener('keydown',e=>{
  if(captureKey(e))return;
  const tg=e.target,tag=tg.tagName,mod=e.ctrlKey||e.metaKey,k=e.code;
  if(e.key==='Escape'&&(trackPick||trackJob)){if(trackJob)trackJob.stop=true;trackPick=null;document.body.classList.remove('picking');toast('트래킹을 취소했습니다.');return;}
  if(e.key==='Escape'){if($('modal').classList.contains('show')&&!exporting){capturing=null;closeModal();}$('menu').style.display='none';if(cur){if(tg.blur&&tag!=='BODY')tg.blur();setTool('V');}return;}
  if(mod&&['Equal','Minus','Digit0','NumpadAdd','NumpadSubtract','Numpad0'].includes(k)){e.preventDefault();if(cur&&k!=='Digit0'&&k!=='Numpad0')setZoom(pps*(k.includes('Minus')||k.includes('Subtract')?1/1.3:1.3));return;}
  if(!cur){if(mod&&k==='Slash'){e.preventDefault();showKeys();}return;}
  if(exporting||e.isComposing)return;
  const cb=comboOf(e);if(!cb)return;const id=KEYLOOK[cb];
  if(id==='save'){e.preventDefault();ACT.save.fn();return;}
  if(tag==='TEXTAREA'||tag==='SELECT'||(tag==='INPUT'&&tg.type!=='range'&&tg.type!=='checkbox'))return;
  if($('modal').classList.contains('show'))return;
  if(tag==='INPUT'&&tg.type==='range'&&/Arrow/.test(k))return;
  if(!id)return;
  e.preventDefault();
  try{ACT[id].fn();}catch(err){console.error(err);}
});

  l.onclick=()=>b.remove();

async function checkUpdate(manual){
  if(!(window.Neutralino&&Neutralino.updater)){if(manual)toast('업데이트 기능을 쓸 수 없습니다. 홈페이지에서 새 버전을 받아 주세요.');return;}
  if(updBusy)return;
  if(updReady){updBar(updReady.v,updReady.notes);return;}
  updBusy=true;
  try{const m=await Neutralino.updater.checkForUpdates(UPDATE_URL);
    if(m&&m.version&&m.version!==window.NL_APPVERSION){
      if(manual)toast(`새 버전 ${m.version}을 받는 중…`);
      await Neutralino.updater.install();
      updReady={v:m.version,notes:(m.data&&m.data.notes)||''};
      updBar(updReady.v,updReady.notes);
    }else if(manual)toast('최신 버전입니다 ('+window.NL_APPVERSION+').');
  }catch(e){if(manual)toast('업데이트를 받지 못했습니다. 인터넷 연결을 확인해 주세요.');}
  updBusy=false;
}

/* ================= 음량 미터 ================= */
const mtr={buf:null,pk:[-90,-90],hold:[0,0],hist:[]};
function dbOf(a){if(!a)return -90;if(!mtr.buf||mtr.buf.length!==a.fftSize)mtr.buf=new Float32Array(a.fftSize);a.getFloatTimeDomainData(mtr.buf);let sum=0,pk=0;for(const v of mtr.buf){sum+=v*v;const x=Math.abs(v);if(x>pk)pk=x;}
  return {rms:sum/mtr.buf.length,pk:pk>0?20*Math.log10(pk):-90};}
function drawMeter(){
  const cvm=$('meterCv');if(!cvm||!cvm.isConnected)return;const r=cvm.getBoundingClientRect();if(r.width<2)return;
  const dpr=Math.min(2,window.devicePixelRatio||1);if(cvm.width!==Math.round(r.width*dpr)||cvm.height!==Math.round(r.height*dpr)){cvm.width=Math.round(r.width*dpr);cvm.height=Math.round(r.height*dpr);}
  const g=cvm.getContext('2d');g.setTransform(dpr,0,0,dpr,0,0);const w=r.width,hh=r.height;g.clearRect(0,0,w,hh);
  const live=playing&&!!anL,L=live?dbOf(anL):{rms:0,pk:-90},Rr=live?dbOf(anR):{rms:0,pk:-90},now=performance.now();
  const ms=(L.rms+Rr.rms)/2;mtr.hist.push([now,ms]);while(mtr.hist.length&&now-mtr.hist[0][0]>3000)mtr.hist.shift();
  const avg=dt=>{let a=0,n=0;for(const[tt,v]of mtr.hist)if(now-tt<=dt){a+=v;n++;}return n&&a>0?10*Math.log10(a/n)-0.69:-Infinity;};
  const M=live?avg(400):-Infinity,Sv=live?avg(3000):-Infinity;
  $('mM').textContent=isFinite(M)?M.toFixed(1)+' LUFS':'-∞';$('mS').textContent=isFinite(Sv)?Sv.toFixed(1)+' LUFS':'-∞';
  const top=8,bot=hh-18,y=db=>top+(bot-top)*clamp(-db/60,0,1),bx=12,bw=12;
  g.font='10px "IBM Plex Sans KR",sans-serif';g.fillStyle='#8f97a8';g.textAlign='right';g.textBaseline='middle';
  for(let db=0;db>=-57;db-=3){g.fillText(String(db),w-6,y(db));g.fillRect(w-34,y(db),4,1);}
  [L,Rr].forEach((ch,i)=>{const x=bx+i*(bw+6);mtr.pk[i]=Math.max(ch.pk,mtr.pk[i]-0.6);
    g.fillStyle='#22262f';g.fillRect(x,top,bw,bot-top);
    const yy=y(Math.max(-60,mtr.pk[i]));if(mtr.pk[i]>-60){const gr=g.createLinearGradient(0,bot,0,top);gr.addColorStop(0,'#2ecc71');gr.addColorStop(.7,'#d9e021');gr.addColorStop(.9,'#ff9f1c');gr.addColorStop(1,'#ff3b30');g.fillStyle=gr;g.fillRect(x,yy,bw,bot-yy);}
    if(ch.pk>mtr.hold[i]||now-(mtr['ht'+i]||0)>1500){mtr.hold[i]=ch.pk;mtr['ht'+i]=now;}if(mtr.hold[i]>-60){g.fillStyle='#fff';g.fillRect(x,y(mtr.hold[i]),bw,2);}
    g.fillStyle='#8f97a8';g.textAlign='center';g.fillText(i?'R':'L',x+bw/2,bot+10);g.textAlign='right';});
}

let LAY=Object.assign({topH:null,leftW:null,projW:300,monLeft:false,tlTop:false},lsGet('cutroom.layout',{}));

  const top=LAY.topH?LAY.topH+'px':'minmax(0,1.08fr)',bot='minmax(0,1fr)';
  app.style.gridTemplateRows=LAY.tlTop?`auto ${bot} 6px ${top}`:`auto ${top} 6px ${bot}`;
  $('top').style.order=0;rA.style.order=LAY.tlTop?3:1;sp.style.order=2;rB.style.order=LAY.tlTop?1:3;
  const left=LAY.leftW?LAY.leftW+'px':'minmax(0,1fr)',mon='minmax(0,1.25fr)';
  rA.style.gridTemplateColumns=LAY.monLeft?`${mon} 6px ${left}`:`${left} 6px ${mon}`;
  $('panelFrame').style.order=LAY.monLeft?3:1;$('splitA').style.order=2;$('monFrame').style.order=LAY.monLeft?1:3;
  rB.style.gridTemplateColumns=`${LAY.projW}px 6px 60px minmax(0,1fr)`;
  lsSet('cutroom.layout',LAY);if(cur){fitCanvas();renderTimeline();}
}
function dragSplit(id,fn){
  const el=$(id);
  el.onpointerdown=e=>{e.preventDefault();el.classList.add('on');busy++;
    const mv=ev=>{fn(ev);applyLayout();};
    const up=()=>{busy--;el.classList.remove('on');removeEventListener('pointermove',mv);removeEventListener('pointerup',up);};
    addEventListener('pointermove',mv);addEventListener('pointerup',up);};
}

['splitH','splitA','splitB'].forEach(id=>$(id).ondblclick=()=>{if(id==='splitH')LAY.topH=null;if(id==='splitA')LAY.leftW=null;if(id==='splitB')LAY.projW=300;applyLayout();});

const STUDIO_URL=window.CUTROOM_STUDIO_URL||(IS_APP?'studio/index.html':'../studio/index.html');
let studio=null;
function openStudio(o){
  o=o||{};if(studio)return;

  const bar=document.createElement('div');bar.className='sbar';
  const t=document.createElement('span');t.innerHTML='<b>Velo Studio</b> · 썸네일 · 이미지 · 이미지 애니메이션'+(cur?' — "🎞 Velo로 보내기"를 누르면 지금 작품의 재생 헤드 위치에 들어갑니다':'');

  bar.append(t,sp,x);

  w.append(bar,fr);document.body.append(w);studio={w,fr,init:o.init||null};
}
function closeStudio(){if(!studio)return;studio.w.remove();studio=null;}
function grabFrameBlob(){
  const was=playing;playing=true;try{draw();}finally{playing=was;}
  const c=document.createElement('canvas');c.width=P.w||W;c.height=P.h||H;c.getContext('2d').drawImage(cv,0,0,c.width,c.height);draw();
  return new Promise(r=>c.toBlob(r,'image/png'));
}
addEventListener('message',async e=>{
  if(!studio||e.source!==studio.fr.contentWindow)return;const m=e.data||{};
  if(m.type==='cutroom-studio-ready'&&studio.init){studio.fr.contentWindow.postMessage(studio.init,'*');studio.init=null;return;}
  if(m.type==='cutroom-studio-export'&&m.blob){
    if(!cur){toast('작품을 연 상태에서 보내 주세요.');return;}
    const f=new File([m.blob],`${m.name||'스튜디오'}-${Date.now().toString(36).slice(-4)}.${m.ext||'png'}`,{type:m.blob.type});
    closeStudio();const at=t;
    await importFiles([f]);
    const s=Object.values(S).filter(x=>x.fname===f.name).pop();if(!s)return;
    if(!P.clips.some(c=>c.src===s.id)){
      pushHistory();const dur=s.type==='video'?s.duration:4;
      const tr=VT.slice(1).find(x=>!P.clips.some(c=>c.tr===x&&c.start<at+dur-1e-3&&end(c)>at+1e-3))||'V5';
      const c=mkClip(s.id,tr,at);if(s.type==='video')c.mute=true;P.clips.push(c);relayout();selectOnly&&selectOnly(c.id);refresh(true);
    }
    toast(s.type==='video'?'스튜디오에서 만든 애니메이션을 타임라인에 넣었습니다.':'스튜디오에서 만든 이미지를 타임라인에 넣었습니다.');
  }
});
